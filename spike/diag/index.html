<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>儲存層診斷（技術驗證）</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111111;
        --muted: #555555;
        --card: #f2f4f8;
        --accent: #1a2b4c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --fg: #f2f2f2;
          --muted: #aaaaaa;
          --card: #1d232b;
          --accent: #6f8fd0;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          18px/1.5 -apple-system,
          system-ui,
          sans-serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
      }
      h1 {
        font-size: 24px;
        margin: 0 0 4px;
      }
      .notice {
        color: var(--muted);
        margin: 0 0 16px;
        font-size: 16px;
      }
      button {
        display: block;
        width: 100%;
        min-height: 56px;
        font-size: 20px;
        font-weight: 600;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #ffffff;
        margin: 12px 0;
      }
      button:disabled {
        opacity: 0.5;
      }
      #status {
        font-size: 16px;
        color: var(--muted);
        min-height: 1.5em;
      }
      .item {
        background: var(--card);
        border-radius: 12px;
        padding: 12px;
        margin: 10px 0;
        overflow-wrap: anywhere;
      }
      .item-title {
        font-weight: 600;
      }
      .item-detail {
        font-size: 15px;
        white-space: pre-wrap;
        margin-top: 4px;
      }
      textarea {
        width: 100%;
        min-height: 240px;
        font:
          12px/1.4 ui-monospace,
          Menlo,
          monospace;
        border-radius: 8px;
        padding: 8px;
        background: var(--card);
        color: var(--fg);
        border: 1px solid var(--muted);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>晨光之誓・儲存層診斷</h1>
      <p class="notice">
        技術驗證頁，測試完成後移除。只使用 <code>spike-</code> 開頭的測試資料庫，不會讀寫遊戲資料。
      </p>
      <button id="start" type="button">開始檢查</button>
      <div id="status" role="status"></div>
      <section id="results"></section>
      <section id="output" hidden>
        <h2>完整結果（JSON）</h2>
        <button id="copy" type="button">複製結果</button>
        <div id="copy-msg" role="status"></div>
        <textarea id="json" readonly></textarea>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
